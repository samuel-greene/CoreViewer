<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OME-TIFF Directory Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div id="path-header">Index of /</div>
    <div class="search-wrap">
      <input type="text" id="search-box" placeholder="Filter files and folders…" autocomplete="off" />
    </div>
    <div class="table-header">
      <span class="type-col">Type</span>
      <span class="name-col">Name</span>
    </div>
    <div id="file-list" class="file-list"></div>
    <div id="no-results" class="no-results" hidden>No matches in this folder</div>
  </div>
  <div id="divider" title="Drag to resize"></div>
  <div id="viewer-container"></div>

  <script>
    let viewer = null;

    const SIDEBAR_MIN_PX = 160;
    const SIDEBAR_MAX_RATIO = 0.7; // never let the sidebar eat more than 70% of the window
    const SIDEBAR_WIDTH_KEY = "ome-viewer-sidebar-width";

    function initResizer() {
      const sidebar = document.getElementById("sidebar");
      const divider = document.getElementById("divider");

      // Restore a previously saved width, if any.
      const savedWidth = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
      if (!Number.isNaN(savedWidth)) {
        applySidebarWidth(savedWidth);
      }

      let dragging = false;

      divider.addEventListener("mousedown", (e) => {
        dragging = true;
        divider.classList.add("dragging");
        document.body.classList.add("resizing");
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        applySidebarWidth(e.clientX);
      });

      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove("dragging");
        document.body.classList.remove("resizing");
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(sidebar.getBoundingClientRect().width));
        if (viewer) viewer.viewport.applyConstraints();
      });

      function applySidebarWidth(clientX) {
        const maxWidth = window.innerWidth * SIDEBAR_MAX_RATIO;
        const clamped = Math.min(Math.max(clientX, SIDEBAR_MIN_PX), maxWidth);
        sidebar.style.width = `${clamped}px`;
        sidebar.style.minWidth = `${clamped}px`;
      }
    }

    function initViewer() {
      viewer = OpenSeadragon({
        id: "viewer-container",
        prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
        showNavigationControl: true,

        // Performance optimizations
        imageLoaderLimit: 10,       // Max parallel requests (default is 6)
        blendingTime: 0,            // Instantly render tiles without cross-fade delays
        animationTime: 0.3,         // Faster pan/zoom transition response
        maxZoomPixelRatio: 2,
        timeout: 30000,
        backgroundColor: "#000000"
      });
    }

    async function loadDirectory(prefix = "") {
      const res = await fetch(`/api/scans?prefix=${encodeURIComponent(prefix)}`);
      const data = await res.json();

      document.getElementById("path-header").textContent = `Index of ${data.current_path}`;
      const listEl = document.getElementById("file-list");
      listEl.innerHTML = "";

      // Parent Directory row
      if (data.parent_prefix !== null) {
        listEl.appendChild(
          createRow("[DIR]", "..", () => loadDirectory(data.parent_prefix), null, { isParentNav: true })
        );
      }

      // Subdirectories
      data.directories.forEach(dir => {
        listEl.appendChild(createRow("[DIR]", dir.name, () => loadDirectory(dir.path)));
      });

      // Scan files
      data.files.forEach(file => {
        const downloadUrl = `/api/scans/${encodeURIComponent(file.id)}/download`;
        const row = createRow("[IMG]", file.name, () => {
          document.querySelectorAll(".row").forEach(r => r.classList.remove("active"));
          row.classList.add("active");
          openImage(file.id);
        }, downloadUrl);
        listEl.appendChild(row);
      });

      // Re-apply whatever's currently in the search box, so the filter
      // persists as you navigate between folders.
      filterRows();
    }

    function createRow(typeTag, name, onClick, downloadUrl = null, options = {}) {
      const row = document.createElement("div");
      row.className = "row";
      if (options.isParentNav) {
        row.classList.add("parent-row");
      }

      const typeSpan = document.createElement("span");
      typeSpan.className = "type-col tag-dir";
      typeSpan.textContent = typeTag;

      const nameSpan = document.createElement("span");
      nameSpan.className = "name-col item-link";
      nameSpan.textContent = name;
      nameSpan.title = name; // Helpful for long names that truncate

      row.appendChild(typeSpan);
      row.appendChild(nameSpan);

      // Append download button if URL is provided
      if (downloadUrl) {
        const dlBtn = document.createElement("a");
        dlBtn.className = "download-btn";
        dlBtn.innerHTML = "[FILE]"; // Unicode download icon
        dlBtn.href = downloadUrl;
        dlBtn.download = name;
        dlBtn.title = "Download " + name;
        dlBtn.onclick = (e) => e.stopPropagation(); // Prevents the row click event
        row.appendChild(dlBtn);
      }

      row.onclick = onClick;
      return row;
    }

    async function openImage(scanId) {
      const infoRes = await fetch(`/api/scans/${encodeURIComponent(scanId)}/info`);
      if (!infoRes.ok) return;
      const info = await infoRes.json();

      const tileSource = {
        height: info.height,
        width: info.width,
        tileSize: info.tile_size,
        maxLevel: info.osd_max_level,
        getTileUrl: function (level, x, y) {
          return `/api/scans/${encodeURIComponent(scanId)}/tiles/${level}/${x}/${y}.jpg`;
        }
      };

      viewer.open(tileSource);
    }

    function filterRows() {
      const query = document.getElementById("search-box").value.trim().toLowerCase();
      const rows = document.querySelectorAll("#file-list .row");
      let visibleCount = 0;

      rows.forEach(row => {
        // The ".." parent-navigation row always stays visible -- it's
        // navigation, not a search result.
        if (row.classList.contains("parent-row")) {
          row.hidden = false;
          return;
        }
        const name = row.querySelector(".name-col").textContent.toLowerCase();
        const matches = query === "" || name.includes(query);
        row.hidden = !matches;
        if (matches) visibleCount++;
      });

      document.getElementById("no-results").hidden = !(query !== "" && visibleCount === 0);
    }

    window.onload = () => {
      initViewer();
      initResizer();
      document.getElementById("search-box").addEventListener("input", filterRows);
      loadDirectory("");
    };
  </script>
</body>
</html>

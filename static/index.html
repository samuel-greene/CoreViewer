<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OME-TIFF Directory Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div id="path-header">Index of /</div>
    <div class="search-wrap">
      <input type="text" id="search-box" placeholder="Filter files and folders…" autocomplete="off" />
    </div>
    <div class="table-header">
      <span class="type-col">Type</span>
      <span class="name-col">Name</span>
    </div>
    <div id="file-list" class="file-list"></div>
    <div id="no-results" class="no-results" hidden>No matches in this folder</div>
  </div>
  <div id="divider" title="Drag to resize"></div>
  <div id="viewer-container">
    <div id="draw-toolbar">
      <button id="btn-draw" class="toolbar-btn">Laser Pointer</button>
      <button id="btn-select" class="toolbar-btn">Box Select</button>
      <div id="download-selection-wrap" class="split-btn-wrap" style="display: none;">
        <button id="btn-download-selection" class="toolbar-btn split-btn-main">Download Selection (JPG)</button>
        <button id="btn-download-format-toggle" class="toolbar-btn split-btn-caret" title="Choose download format" aria-haspopup="true" aria-expanded="false">▾</button>
        <div id="download-format-menu" class="format-menu" hidden>
          <button type="button" class="format-option" data-format="jpg">JPEG (.jpg)</button>
          <button type="button" class="format-option" data-format="tiff">TIFF (.tiff)</button>
        </div>
      </div>
      <button id="btn-clear" class="toolbar-btn">Clear</button>
    </div>
  </div>

  <script>
    let viewer = null;
    let currentScanId = null;
    let activeTool = 'none'; // 'laser', 'select', 'none'
    let strokes = [];
    let selectionBox = null; // { x, y, w, h } in full-image pixels
    let selectionStart = null;
    let drawCanvas, drawCtx;

    const SIDEBAR_MIN_PX = 160;
    const SIDEBAR_MAX_RATIO = 0.7; // never let the sidebar eat more than 70% of the window
    const SIDEBAR_WIDTH_KEY = "ome-viewer-sidebar-width";

    function initResizer() {
      const sidebar = document.getElementById("sidebar");
      const divider = document.getElementById("divider");

      // Restore a previously saved width, if any.
      const savedWidth = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
      if (!Number.isNaN(savedWidth)) {
        applySidebarWidth(savedWidth);
      }

      let dragging = false;

      divider.addEventListener("mousedown", (e) => {
        dragging = true;
        divider.classList.add("dragging");
        document.body.classList.add("resizing");
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        applySidebarWidth(e.clientX);
      });

      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove("dragging");
        document.body.classList.remove("resizing");
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(sidebar.getBoundingClientRect().width));
        if (viewer) viewer.viewport.applyConstraints();
      });

      function applySidebarWidth(clientX) {
        const maxWidth = window.innerWidth * SIDEBAR_MAX_RATIO;
        const clamped = Math.min(Math.max(clientX, SIDEBAR_MIN_PX), maxWidth);
        sidebar.style.width = `${clamped}px`;
        sidebar.style.minWidth = `${clamped}px`;
      }
    }

    function initViewer() {
      viewer = OpenSeadragon({
        id: "viewer-container",
        prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
        showNavigationControl: true,
        

        // Performance optimizations
        imageLoaderLimit: 10,       // Max parallel requests (default is 6)
        blendingTime: 0,            // Instantly render tiles without cross-fade delays
        animationTime: 0.3,         // Faster pan/zoom transition response
        maxZoomPixelRatio: 2,
        timeout: 30000,
        backgroundColor: "#000000"
      });
    }

    async function loadDirectory(prefix = "") {
      const res = await fetch(`/api/scans?prefix=${encodeURIComponent(prefix)}`);
      const data = await res.json();

      document.getElementById("path-header").textContent = `Index of ${data.current_path}`;
      const listEl = document.getElementById("file-list");
      listEl.innerHTML = "";

      // Parent Directory row
      if (data.parent_prefix !== null) {
        listEl.appendChild(
          createRow("[DIR]", "..", () => loadDirectory(data.parent_prefix), null, { isParentNav: true })
        );
      }

      // Subdirectories
      data.directories.forEach(dir => {
        listEl.appendChild(createRow("[DIR]", dir.name, () => loadDirectory(dir.path)));
      });

      // Scan files
      data.files.forEach(file => {
        const downloadUrl = `/api/scans/${encodeURIComponent(file.id)}/download`;
        const row = createRow("[IMG]", file.name, () => {
          document.querySelectorAll(".row").forEach(r => r.classList.remove("active"));
          row.classList.add("active");
          openImage(file.id);
        }, downloadUrl, file.size);
        listEl.appendChild(row);
      });

      // Re-apply whatever's currently in the search box, so the filter
      // persists as you navigate between folders.
      filterRows();
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return "0 B";

      const units = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));

      return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function createRow(typeTag, name, onClick, downloadUrl = null, size = null, options = {}) {
      const row = document.createElement("div");
      row.className = "row";
      if (options.isParentNav) {
        row.classList.add("parent-row");
      }

      const typeSpan = document.createElement("span");
      typeSpan.className = "type-col tag-dir";
      typeSpan.textContent = typeTag;

      const nameSpan = document.createElement("span");
      nameSpan.className = "name-col item-link";
      nameSpan.textContent = name;
      nameSpan.title = name; // Helpful for long names that truncate

      row.appendChild(typeSpan);
      row.appendChild(nameSpan);

      // Append file size
      if (size !== null && size !== undefined) {
        const sizeSpan = document.createElement("span");
        sizeSpan.className = "size-col";
        sizeSpan.textContent = formatFileSize(size);
        sizeSpan.title = `${size.toLocaleString()} bytes`;
        row.appendChild(sizeSpan);
      }
      // Append download button if URL is provided
      if (downloadUrl) {
        const dlBtn = document.createElement("a");
        dlBtn.className = "download-btn";
        dlBtn.innerHTML = "[DOWNLOAD]"; // Unicode download icon
        dlBtn.href = downloadUrl;
        dlBtn.download = name;
        dlBtn.title = "Download " + name;
        dlBtn.onclick = (e) => e.stopPropagation(); // Prevents the row click event
        row.appendChild(dlBtn);
      }

      row.onclick = onClick;
      return row;
    }

    async function openImage(scanId) {
      currentScanId = scanId;
      const infoRes = await fetch(`/api/scans/${encodeURIComponent(scanId)}/info`);
      if (!infoRes.ok) return;
      const info = await infoRes.json();

      const tileSource = {
        height: info.height,
        width: info.width,
        tileSize: info.tile_size,
        maxLevel: info.osd_max_level,
        getTileUrl: function (level, x, y) {
          return `/api/scans/${encodeURIComponent(scanId)}/tiles/${level}/${x}/${y}.jpg`;
        }
      };

      viewer.open(tileSource);
    }

    function filterRows() {
      const query = document.getElementById("search-box").value.trim().toLowerCase();
      const rows = document.querySelectorAll("#file-list .row");
      let visibleCount = 0;

      rows.forEach(row => {
        // The ".." parent-navigation row always stays visible -- it's
        // navigation, not a search result.
        if (row.classList.contains("parent-row")) {
          row.hidden = false;
          return;
        }
        const name = row.querySelector(".name-col").textContent.toLowerCase();
        const matches = query === "" || name.includes(query);
        row.hidden = !matches;
        if (matches) visibleCount++;
      });

      document.getElementById("no-results").hidden = !(query !== "" && visibleCount === 0);
    }

    let isDrawMode = false;
    const LASER_SCREEN_WIDTH = 4; // must match the on-screen lineWidth used in redraw()

    // Laser strokes are recorded in full-image pixel coordinates, but their
    // on-screen thickness depends on the current zoom level. To reproduce a
    // similar-looking mark in an exported crop (which is at native
    // resolution), we capture how many image pixels one screen pixel
    // currently covers, and bake that into the stroke's width up front.
    function imagePixelsPerScreenPixel() {
      const centerViewport = viewer.viewport.getCenter(true);
      const p1 = viewer.viewport.viewportToImageCoordinates(centerViewport);
      const screenPoint = viewer.viewport.pixelFromPoint(centerViewport, true);
      const p2 = viewer.viewport.viewportToImageCoordinates(
        viewer.viewport.pointFromPixel(screenPoint.plus(new OpenSeadragon.Point(1, 0)), true)
      );
      return Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
    }

    function initDrawTool() {
      const container = document.getElementById('viewer-container');
      drawCanvas = document.createElement('canvas');
      drawCanvas.style.position = 'absolute';
      drawCanvas.style.top = '0';
      drawCanvas.style.left = '0';
      drawCanvas.style.width = '100%';
      drawCanvas.style.height = '100%';
      drawCanvas.style.pointerEvents = 'none';
      drawCanvas.style.zIndex = '10';

      container.appendChild(drawCanvas);
      drawCtx = drawCanvas.getContext('2d');

      const btnDraw = document.getElementById('btn-draw');
      const btnSelect = document.getElementById('btn-select');
      const btnClear = document.getElementById('btn-clear');

      const downloadWrap = document.getElementById('download-selection-wrap');
      const btnDownloadSel = document.getElementById('btn-download-selection');
      const btnFormatToggle = document.getElementById('btn-download-format-toggle');
      const formatMenu = document.getElementById('download-format-menu');

      const DOWNLOAD_FORMAT_KEY = 'ome-viewer-download-format';
      let downloadFormat = localStorage.getItem(DOWNLOAD_FORMAT_KEY) || 'jpg';

      function setDownloadFormat(format) {
        downloadFormat = format;
        localStorage.setItem(DOWNLOAD_FORMAT_KEY, format);
        btnDownloadSel.textContent = `Download Selection (${format.toUpperCase()})`;
        formatMenu.querySelectorAll('.format-option').forEach(opt => {
          opt.classList.toggle('selected', opt.dataset.format === format);
        });
      }
      setDownloadFormat(downloadFormat);

      function closeFormatMenu() {
        formatMenu.hidden = true;
        btnFormatToggle.setAttribute('aria-expanded', 'false');
      }

      btnFormatToggle.onclick = (e) => {
        e.stopPropagation();
        const willOpen = formatMenu.hidden;
        formatMenu.hidden = !willOpen;
        btnFormatToggle.setAttribute('aria-expanded', String(willOpen));
      };

      formatMenu.querySelectorAll('.format-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          setDownloadFormat(opt.dataset.format);
          closeFormatMenu();
        };
      });

      document.addEventListener('click', (e) => {
        if (!downloadWrap.contains(e.target)) closeFormatMenu();
      });

      function setTool(tool) {
        activeTool = activeTool === tool ? 'none' : tool;

        btnDraw.classList.toggle('active', activeTool === 'laser');
        btnSelect.classList.toggle('active', activeTool === 'select');

        const isActive = activeTool !== 'none';
        drawCanvas.style.pointerEvents = isActive ? 'auto' : 'none';
        // Note: we deliberately do NOT call viewer.setMouseNavEnabled() here.
        // The draw canvas sitting on top already intercepts mousedown/drag
        // when a tool is active, which is what stops OpenSeadragon from
        // panning. Scroll-to-zoom is forwarded manually below (see the
        // 'wheel' listener) so zooming keeps working while a tool is active.

        isMouseDown = false;
        currentStroke = null;
        selectionStart = null;
      }

      btnDraw.onclick = () => setTool('laser');
      btnSelect.onclick = () => setTool('select');

      btnDownloadSel.onclick = async () => {
        if (!selectionBox || !currentScanId) {
          alert("No active selection or image loaded.");
          return;
        }

        const x = Math.round(selectionBox.x);
        const y = Math.round(selectionBox.y);
        const w = Math.round(selectionBox.w);
        const h = Math.round(selectionBox.h);

        const format = downloadFormat;
        const downloadUrl = `/api/scans/${encodeURIComponent(currentScanId)}/crop`;

        // Only bring along strokes that actually land in (or near) the
        // selected region -- markings entirely outside it wouldn't render
        // in the crop anyway.
        const margin = 50;
        const markings = strokes
          .filter(stroke => stroke.points.some(p =>
            p.x >= x - margin && p.x <= x + w + margin &&
            p.y >= y - margin && p.y <= y + h + margin
          ))
          .map(stroke => ({
            points: stroke.points.map(p => [p.x, p.y]),
            width: stroke.widthImage,
          }));

        try {
          const response = await fetch(downloadUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ x, y, w, h, format, markings }),
          });
          if (!response.ok) {
            const errData = await response.json().catch(() => ({ detail: response.statusText }));
            alert(`Download failed (${response.status}): ${errData.detail || 'Server error'}`);
            return;
          }

          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);
          const cleanName = currentScanId.split('/').pop().replace(/\.[^/.]+$/, "");
          const extension = format === 'tiff' ? 'tiff' : format;
          const filename = `${cleanName}_crop_${x}_${y}_${w}_${h}.${extension}`;

          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        } catch (err) {
          alert(`Download error: ${err.message}`);
        }
      };

      btnClear.onclick = () => {
        strokes = [];
        selectionBox = null;
        selectionStart = null;
        downloadWrap.style.display = 'none';
        closeFormatMenu();
        redraw();
      };

      let isMouseDown = false;
      let currentStroke = null;

      drawCanvas.addEventListener('mousedown', (e) => {
        if (activeTool === 'none') return;
        isMouseDown = true;

        const rect = drawCanvas.getBoundingClientRect();
        const pixelPos = new OpenSeadragon.Point(e.clientX - rect.left, e.clientY - rect.top);
        const viewportPos = viewer.viewport.pointFromPixel(pixelPos);
        const imagePos = viewer.viewport.viewportToImageCoordinates(viewportPos);

        if (activeTool === 'laser') {
          currentStroke = {
            points: [imagePos],
            widthImage: LASER_SCREEN_WIDTH * imagePixelsPerScreenPixel(),
          };
          strokes.push(currentStroke);
        } else if (activeTool === 'select') {
          selectionStart = imagePos;
          selectionBox = { x: imagePos.x, y: imagePos.y, w: 0, h: 0 };
          downloadWrap.style.display = 'none';
          closeFormatMenu();
        }
        redraw();
      });

      drawCanvas.addEventListener('mousemove', (e) => {
        if (activeTool === 'none' || !isMouseDown) return;

        const rect = drawCanvas.getBoundingClientRect();
        const pixelPos = new OpenSeadragon.Point(e.clientX - rect.left, e.clientY - rect.top);
        const viewportPos = viewer.viewport.pointFromPixel(pixelPos);
        const imagePos = viewer.viewport.viewportToImageCoordinates(viewportPos);

        if (activeTool === 'laser' && currentStroke) {
          currentStroke.points.push(imagePos);
        } else if (activeTool === 'select' && selectionStart) {
          const x = Math.min(selectionStart.x, imagePos.x);
          const y = Math.min(selectionStart.y, imagePos.y);
          const w = Math.abs(imagePos.x - selectionStart.x);
          const h = Math.abs(imagePos.y - selectionStart.y);
          selectionBox = { x, y, w, h };
        }
        redraw();
      });

      window.addEventListener('mouseup', () => {
        if (isMouseDown) {
          isMouseDown = false;
          if (activeTool === 'select' && selectionBox) {
            if (selectionBox.w > 10 && selectionBox.h > 10) {
              downloadWrap.style.display = 'inline-flex';
            } else {
              selectionBox = null;
              downloadWrap.style.display = 'none';
            }
          }
          currentStroke = null;
          redraw();
        }
      });

      // While a draw tool is active, the overlay canvas sits above
      // OpenSeadragon and captures every mouse event -- including wheel --
      // so scroll-to-zoom would otherwise stop working entirely. Forward
      // wheel events to the viewport manually, matching OSD's own
      // scroll-zoom feel, so you can still zoom in/out while drawing.
      drawCanvas.addEventListener('wheel', (e) => {
        if (activeTool === 'none') return;
        e.preventDefault();

        const rect = drawCanvas.getBoundingClientRect();
        const pixelPos = new OpenSeadragon.Point(e.clientX - rect.left, e.clientY - rect.top);
        const zoomPoint = viewer.viewport.pointFromPixel(pixelPos);

        const zoomPerScroll = 1.2;
        const factor = e.deltaY < 0 ? zoomPerScroll : 1 / zoomPerScroll;

        viewer.viewport.zoomBy(factor, zoomPoint);
        viewer.viewport.applyConstraints();
      }, { passive: false });

      viewer.addHandler('update-viewport', redraw);
      viewer.addHandler('resize', resizeCanvas);
      setTimeout(resizeCanvas, 100);
    }

    function resizeCanvas() {
      const container = document.getElementById('viewer-container');
      drawCanvas.width = container.clientWidth;
      drawCanvas.height = container.clientHeight;
      redraw();
    }

    function redraw() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

      // Render Laser Strokes
      if (strokes.length > 0) {
        drawCtx.strokeStyle = '#ef4444';
        drawCtx.lineWidth = LASER_SCREEN_WIDTH;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.setLineDash([]);

        strokes.forEach(stroke => {
          const points = stroke.points;
          if (points.length < 2) return;
          drawCtx.beginPath();
          const firstPx = viewer.viewport.pixelFromPoint(viewer.viewport.imageToViewportCoordinates(points[0]));
          drawCtx.moveTo(firstPx.x, firstPx.y);

          for (let i = 1; i < points.length; i++) {
            const px = viewer.viewport.pixelFromPoint(viewer.viewport.imageToViewportCoordinates(points[i]));
            drawCtx.lineTo(px.x, px.y);
          }
          drawCtx.stroke();
        });
      }

      // Render Selection Box
      if (selectionBox) {
        const topLeftPx = viewer.viewport.pixelFromPoint(
          viewer.viewport.imageToViewportCoordinates(new OpenSeadragon.Point(selectionBox.x, selectionBox.y))
        );
        const bottomRightPx = viewer.viewport.pixelFromPoint(
          viewer.viewport.imageToViewportCoordinates(new OpenSeadragon.Point(selectionBox.x + selectionBox.w, selectionBox.y + selectionBox.h))
        );

        const boxX = topLeftPx.x;
        const boxY = topLeftPx.y;
        const boxW = bottomRightPx.x - topLeftPx.x;
        const boxH = bottomRightPx.y - topLeftPx.y;

        // Region Highlight Overlay
        drawCtx.fillStyle = 'rgba(56, 189, 248, 0.2)';
        drawCtx.fillRect(boxX, boxY, boxW, boxH);

        // Dashed Selection Rectangle
        drawCtx.strokeStyle = '#38bdf8';
        drawCtx.lineWidth = 2;
        drawCtx.setLineDash([6, 6]);
        drawCtx.strokeRect(boxX, boxY, boxW, boxH);
        drawCtx.setLineDash([]);
      }
    }

    window.onload = () => {
      initViewer();
      initDrawTool();
      initResizer();
      document.getElementById("search-box").addEventListener("input", filterRows);
      loadDirectory("");
    };
  </script>
</body>
</html>

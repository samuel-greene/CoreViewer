<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OME-TIFF Viewer</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>OME-TIFF Viewer</h1>
    <label for="scan-select">Scan</label>
    <select id="scan-select" disabled>
      <option>Loading scans…</option>
    </select>
    <span id="status" role="status">Starting…</span>
  </header>
  <main id="viewer" aria-label="Microscopy image viewer"></main>
  <script src="/viewer.js"></script>
</body>
</html>

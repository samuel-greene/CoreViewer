<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OME-TIFF Directory Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div id="path-header">Index of /</div>
    <div class="search-wrap">
      <input type="text" id="search-box" placeholder="Filter files and folders…" autocomplete="off" />
    </div>
    <div class="table-header">
      <span class="type-col">Type</span>
      <span class="name-col">Name</span>
    </div>
    <div id="file-list" class="file-list"></div>
    <div id="no-results" class="no-results" hidden>No matches in this folder</div>
  </div>
  <div id="divider" title="Drag to resize"></div>
  <div id="viewer-container">
    <div id="draw-toolbar">
      <button id="btn-draw" class="toolbar-btn">Laser Pointer</button>
      <button id="btn-clear" class="toolbar-btn">Clear</button>
    </div>
  </div>

  <script>
    let viewer = null;

    const SIDEBAR_MIN_PX = 160;
    const SIDEBAR_MAX_RATIO = 0.7; // never let the sidebar eat more than 70% of the window
    const SIDEBAR_WIDTH_KEY = "ome-viewer-sidebar-width";

    function initResizer() {
      const sidebar = document.getElementById("sidebar");
      const divider = document.getElementById("divider");

      // Restore a previously saved width, if any.
      const savedWidth = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
      if (!Number.isNaN(savedWidth)) {
        applySidebarWidth(savedWidth);
      }

      let dragging = false;

      divider.addEventListener("mousedown", (e) => {
        dragging = true;
        divider.classList.add("dragging");
        document.body.classList.add("resizing");
        e.preventDefault();
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        applySidebarWidth(e.clientX);
      });

      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove("dragging");
        document.body.classList.remove("resizing");
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(sidebar.getBoundingClientRect().width));
        if (viewer) viewer.viewport.applyConstraints();
      });

      function applySidebarWidth(clientX) {
        const maxWidth = window.innerWidth * SIDEBAR_MAX_RATIO;
        const clamped = Math.min(Math.max(clientX, SIDEBAR_MIN_PX), maxWidth);
        sidebar.style.width = `${clamped}px`;
        sidebar.style.minWidth = `${clamped}px`;
      }
    }

    function initViewer() {
      viewer = OpenSeadragon({
        id: "viewer-container",
        prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
        showNavigationControl: true,
        

        // Performance optimizations
        imageLoaderLimit: 10,       // Max parallel requests (default is 6)
        blendingTime: 0,            // Instantly render tiles without cross-fade delays
        animationTime: 0.3,         // Faster pan/zoom transition response
        maxZoomPixelRatio: 2,
        timeout: 30000,
        backgroundColor: "#000000"
      });
    }

    async function loadDirectory(prefix = "") {
      const res = await fetch(`/api/scans?prefix=${encodeURIComponent(prefix)}`);
      const data = await res.json();

      document.getElementById("path-header").textContent = `Index of ${data.current_path}`;
      const listEl = document.getElementById("file-list");
      listEl.innerHTML = "";

      // Parent Directory row
      if (data.parent_prefix !== null) {
        listEl.appendChild(
          createRow("[DIR]", "..", () => loadDirectory(data.parent_prefix), null, { isParentNav: true })
        );
      }

      // Subdirectories
      data.directories.forEach(dir => {
        listEl.appendChild(createRow("[DIR]", dir.name, () => loadDirectory(dir.path)));
      });

      // Scan files
      data.files.forEach(file => {
        const downloadUrl = `/api/scans/${encodeURIComponent(file.id)}/download`;
        const row = createRow("[IMG]", file.name, () => {
          document.querySelectorAll(".row").forEach(r => r.classList.remove("active"));
          row.classList.add("active");
          openImage(file.id);
        }, downloadUrl);
        listEl.appendChild(row);
      });

      // Re-apply whatever's currently in the search box, so the filter
      // persists as you navigate between folders.
      filterRows();
    }

    function createRow(typeTag, name, onClick, downloadUrl = null, options = {}) {
      const row = document.createElement("div");
      row.className = "row";
      if (options.isParentNav) {
        row.classList.add("parent-row");
      }

      const typeSpan = document.createElement("span");
      typeSpan.className = "type-col tag-dir";
      typeSpan.textContent = typeTag;

      const nameSpan = document.createElement("span");
      nameSpan.className = "name-col item-link";
      nameSpan.textContent = name;
      nameSpan.title = name; // Helpful for long names that truncate

      row.appendChild(typeSpan);
      row.appendChild(nameSpan);

      // Append download button if URL is provided
      if (downloadUrl) {
        const dlBtn = document.createElement("a");
        dlBtn.className = "download-btn";
        dlBtn.innerHTML = "[FILE]"; // Unicode download icon
        dlBtn.href = downloadUrl;
        dlBtn.download = name;
        dlBtn.title = "Download " + name;
        dlBtn.onclick = (e) => e.stopPropagation(); // Prevents the row click event
        row.appendChild(dlBtn);
      }

      row.onclick = onClick;
      return row;
    }

    async function openImage(scanId) {
      const infoRes = await fetch(`/api/scans/${encodeURIComponent(scanId)}/info`);
      if (!infoRes.ok) return;
      const info = await infoRes.json();

      const tileSource = {
        height: info.height,
        width: info.width,
        tileSize: info.tile_size,
        maxLevel: info.osd_max_level,
        getTileUrl: function (level, x, y) {
          return `/api/scans/${encodeURIComponent(scanId)}/tiles/${level}/${x}/${y}.jpg`;
        }
      };

      viewer.open(tileSource);
    }

    function filterRows() {
      const query = document.getElementById("search-box").value.trim().toLowerCase();
      const rows = document.querySelectorAll("#file-list .row");
      let visibleCount = 0;

      rows.forEach(row => {
        // The ".." parent-navigation row always stays visible -- it's
        // navigation, not a search result.
        if (row.classList.contains("parent-row")) {
          row.hidden = false;
          return;
        }
        const name = row.querySelector(".name-col").textContent.toLowerCase();
        const matches = query === "" || name.includes(query);
        row.hidden = !matches;
        if (matches) visibleCount++;
      });

      document.getElementById("no-results").hidden = !(query !== "" && visibleCount === 0);
    }

    let isDrawMode = false;
    let strokes = []; // Stores our laser pointer markings
    let drawCanvas, drawCtx;

    function initDrawTool() {
      // 1. Mount overlay to outer container, NOT internal viewer.canvas
      const container = document.getElementById('viewer-container');
      
      drawCanvas = document.createElement('canvas');
      drawCanvas.style.position = 'absolute';
      drawCanvas.style.top = '0';
      drawCanvas.style.left = '0';
      drawCanvas.style.width = '100%';
      drawCanvas.style.height = '100%';
      drawCanvas.style.pointerEvents = 'none'; // Click-through to OSD on startup
      drawCanvas.style.zIndex = '10';          // Sit directly over OSD layers
      
      container.appendChild(drawCanvas);
      drawCtx = drawCanvas.getContext('2d');

      // 2. Setup Toolbar Interactions
      const btnDraw = document.getElementById('btn-draw');
      const btnClear = document.getElementById('btn-clear');

      btnDraw.onclick = () => {
        isDrawMode = !isDrawMode;
        btnDraw.classList.toggle('active', isDrawMode);

        // Toggle click-through and OSD mouse navigation
        drawCanvas.style.pointerEvents = isDrawMode ? 'auto' : 'none';
        viewer.setMouseNavEnabled(!isDrawMode);

        if (!isDrawMode) {
          isMouseDown = false;
          currentStroke = null;
        }
      };

      btnClear.onclick = () => {
        strokes = [];
        redraw();
      };

      // 3. Track drawing with isolated native mouse events
      let isMouseDown = false;
      let currentStroke = null;

      drawCanvas.addEventListener('mousedown', (e) => {
        if (!isDrawMode) return;
        isMouseDown = true;

        const rect = drawCanvas.getBoundingClientRect();
        const pixelPos = new OpenSeadragon.Point(e.clientX - rect.left, e.clientY - rect.top);
        
        const viewportPos = viewer.viewport.pointFromPixel(pixelPos);
        const imagePos = viewer.viewport.viewportToImageCoordinates(viewportPos);
        
        currentStroke = [imagePos];
        strokes.push(currentStroke);
        redraw();
      });

      drawCanvas.addEventListener('mousemove', (e) => {
        if (!isDrawMode || !isMouseDown || !currentStroke) return;

        const rect = drawCanvas.getBoundingClientRect();
        const pixelPos = new OpenSeadragon.Point(e.clientX - rect.left, e.clientY - rect.top);

        const viewportPos = viewer.viewport.pointFromPixel(pixelPos);
        const imagePos = viewer.viewport.viewportToImageCoordinates(viewportPos);

        currentStroke.push(imagePos);
        redraw();
      });

      window.addEventListener('mouseup', () => {
        if (isMouseDown) {
          isMouseDown = false;
          currentStroke = null;
        }
      });

      // 4. Force redraw on pan, zoom, or resize
      viewer.addHandler('update-viewport', redraw);
      viewer.addHandler('resize', resizeCanvas);

      setTimeout(resizeCanvas, 100);
    }

    function resizeCanvas() {
      const container = document.getElementById('viewer-container');
      drawCanvas.width = container.clientWidth;
      drawCanvas.height = container.clientHeight;
      redraw();
    }

    function redraw() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (strokes.length === 0) return;

      drawCtx.strokeStyle = '#ef4444'; // Laser red
      drawCtx.lineWidth = 4;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      strokes.forEach(stroke => {
        if (stroke.length < 2) return;
        drawCtx.beginPath();
        
        // Translate image coordinates back to screen pixels for HTML5 Canvas
        const firstVp = viewer.viewport.imageToViewportCoordinates(stroke[0]);
        const firstPx = viewer.viewport.pixelFromPoint(firstVp);
        drawCtx.moveTo(firstPx.x, firstPx.y);

        for (let i = 1; i < stroke.length; i++) {
          const vp = viewer.viewport.imageToViewportCoordinates(stroke[i]);
          const px = viewer.viewport.pixelFromPoint(vp);
          drawCtx.lineTo(px.x, px.y);
        }
        drawCtx.stroke();
      });
    }

    window.onload = () => {
      initViewer();
      initDrawTool();
      initResizer();
      document.getElementById("search-box").addEventListener("input", filterRows);
      loadDirectory("");
    };
  </script>
</body>
</html>
